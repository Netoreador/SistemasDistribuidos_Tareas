services:
  # 1. Base de datos Redis
  redis-db:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pipeline-net
    command: >
      redis-server 
      --maxmemory 50mb
    
      --maxmemory-policy allkeys-lfu
#  --maxmemory-policy allkeys-lru
  #1443
  

  #KFKA
  kafka:
      image: confluentinc/cp-kafka:7.5.0
      container_name: kafka_broker
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
        KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
        KAFKA_OFFERS_VOLUMES: "true"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_PROCESS_ROLES: 'broker,controller'
        KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
        KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
        KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
        KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
        KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
        CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      networks:
        - pipeline-net

  # 2. Contenedor Node.js
  node-app:
    build: ./see
    container_name: respuestas
    volumes:
      - ./data:/data
    depends_on:
      redis-db:
        condition: service_healthy
    networks:
      - pipeline-net
    environment:
      - PYTHONUNBUFFERED=1

  # 3. Contenedor Lector de CSV (Python)
  csv-reader:
    build: ./envia
    container_name: csv_reader_service
    volumes:
      - ./data:/data
    depends_on:
      redis-db:
        condition: service_healthy
    networks:
      - pipeline-net
    environment:
      - PYTHONUNBUFFERED=1

  # 4. Contenedor Escritor de CSV (Python)
  csv-writer:
    build: ./write
    container_name: csv_writer_service
    volumes:
      - ./data:/data
    depends_on:
      redis-db:
        condition: service_healthy
    networks:
      - pipeline-net
    environment:
      - PYTHONUNBUFFERED=1

  redis-manager:
    build: ./redis
    container_name: redis_manager
    volumes:
      - ./data:/data
    depends_on:
      redis-db:
        condition: service_healthy
    networks:
      - pipeline-net
    environment:
      - PYTHONUNBUFFERED=1

# Define the network used by all services above
networks:
  pipeline-net:
    driver: bridge
